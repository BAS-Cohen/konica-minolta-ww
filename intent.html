<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>How Can We Help?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      padding: 12px 16px;
      color: #1a1a2e;
    }

    .heading {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 12px;
      opacity: 0;
      animation: riseIn 0.35s ease forwards;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    /* ---------- option rows ---------- */

    .option-btn {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 12px;
      background: #ffffff;
      color: #1a1a2e;
      border: 1px solid #d8dee6;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      line-height: 1.3;
      cursor: pointer;
      text-align: left;
      overflow: hidden;
      opacity: 0;
      transform: translateY(6px);
      animation: riseIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.18s ease;
    }

    .option-btn:nth-child(1) { animation-delay: 0.04s; }
    .option-btn:nth-child(2) { animation-delay: 0.09s; }
    .option-btn:nth-child(3) { animation-delay: 0.14s; }
    .option-btn:nth-child(4) { animation-delay: 0.19s; }
    .option-btn:nth-child(5) { animation-delay: 0.24s; }

    @keyframes riseIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .option-btn:hover:not(:disabled) {
      border-color: #1a3a5c;
      background: #f6f9fc;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(26, 58, 92, 0.13);
    }

    .option-btn:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(26, 58, 92, 0.12);
    }

    .option-btn:focus-visible {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }

    .option-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .option-btn.selected:disabled { opacity: 1; }

    .label { flex: 1 1 auto; }

    /* icon badge */
    .badge {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: #e8f0fe;
      color: #1a3a5c;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, color 0.2s ease, transform 0.25s ease;
    }

    .badge svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .option-btn:hover:not(:disabled) .badge {
      background: #1a3a5c;
      color: #ffffff;
      transform: scale(1.04);
    }

    /* chevron */
    .chev {
      flex: 0 0 auto;
      width: 14px;
      height: 14px;
      color: #9aa9b8;
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity 0.2s ease, transform 0.2s ease, color 0.2s ease;
    }

    .chev svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .option-btn:hover:not(:disabled) .chev {
      opacity: 1;
      transform: translateX(0);
      color: #1a3a5c;
    }

    /* selected */
    .option-btn.selected {
      background: linear-gradient(135deg, #1a3a5c 0%, #27547e 100%);
      border-color: #1a3a5c;
      color: #ffffff;
      font-weight: 600;
      transform: translateY(0);
      box-shadow: 0 4px 16px rgba(26, 58, 92, 0.28);
      animation: pulseRing 0.6s ease;
    }

    .option-btn.selected .badge {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }

    .option-btn.selected .chev { opacity: 0; }

    @keyframes pulseRing {
      0%   { box-shadow: 0 0 0 0 rgba(26, 58, 92, 0.45); }
      100% { box-shadow: 0 4px 16px rgba(26, 58, 92, 0.28); }
    }

    /* the tick that replaces the icon once chosen */
    .badge .tick-path {
      stroke-dasharray: 22;
      stroke-dashoffset: 22;
      transition: stroke-dashoffset 0.35s ease 0.08s;
    }

    .option-btn.selected .badge .tick-path { stroke-dashoffset: 0; }
    .badge .icon-path { transition: opacity 0.15s ease; }
    .option-btn.selected .badge .icon-path { opacity: 0; }

    /* open state for Something else */
    .option-btn.open {
      border-color: #1a3a5c;
      background: #eef4fb;
      font-weight: 600;
    }

    .option-btn.open .badge { background: #1a3a5c; color: #ffffff; }
    .option-btn.open .chev { opacity: 1; transform: rotate(90deg); color: #1a3a5c; }

    /* ---------- other panel ---------- */

    .other-panel {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease, margin-top 0.3s ease;
      margin-top: 0;
    }

    .other-panel.show {
      max-height: 220px;
      opacity: 1;
      margin-top: 8px;
    }

    .other-panel textarea {
      width: 100%;
      min-height: 70px;
      resize: none;
      padding: 11px 12px;
      background: #ffffff;
      color: #111827;
      border: 1px solid #d8dee6;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      line-height: 1.4;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .other-panel textarea:focus {
      outline: none;
      border-color: #1a3a5c;
      box-shadow: 0 0 0 3px rgba(26, 58, 92, 0.12);
    }

    .other-panel textarea.invalid {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }

    .other-panel textarea:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      background: #f9fafb;
    }

    .meter {
      margin-top: 6px;
      height: 3px;
      border-radius: 3px;
      background: #e6ebf1;
      overflow: hidden;
    }

    .meter span {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: 3px;
      background: linear-gradient(90deg, #1a3a5c, #3b82f6);
      transition: width 0.18s ease, background 0.2s ease;
    }

    .meter.limit span { background: linear-gradient(90deg, #b45309, #f59e0b); }

    .counter {
      margin-top: 4px;
      font-size: 11px;
      color: #6b7280;
      text-align: right;
      transition: color 0.2s ease;
    }

    .counter.limit { color: #b45309; }

    .send-btn {
      position: relative;
      width: 100%;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 14px;
      background: linear-gradient(135deg, #1a3a5c 0%, #27547e 100%);
      color: #ffffff;
      border: 1px solid #1a3a5c;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      overflow: hidden;
      transition: filter 0.2s ease, box-shadow 0.2s ease, transform 0.18s ease, background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .send-btn:hover:not(:disabled):not(.error) {
      filter: brightness(1.12);
      transform: translateY(-1px);
      box-shadow: 0 5px 16px rgba(26, 58, 92, 0.3);
    }

    .send-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.4);
    }

    .send-btn.error {
      background: #fef2f2;
      border-color: #dc2626;
      color: #b91c1c;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px); }
      40% { transform: translateX(4px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }

    .send-btn.submitted {
      cursor: default;
      transform: none;
      animation: pulseRing 0.6s ease;
    }

    .send-btn:disabled { opacity: 1; }

    .tick {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.15s ease, transform 0.2s ease;
    }

    .tick path {
      stroke: #ffffff;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 22;
      stroke-dashoffset: 22;
      transition: stroke-dashoffset 0.35s ease 0.05s;
    }

    .send-btn.submitted .tick { opacity: 1; transform: scale(1); }
    .send-btn.submitted .tick path { stroke-dashoffset: 0; }

    .status {
      margin-top: 8px;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      display: none;
    }

    .status.show { display: block; }
    .status.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }

    @media (prefers-reduced-motion: reduce) {
      *, *::after { animation: none !important; transition: none !important; }
      .heading, .option-btn { opacity: 1; transform: none; }
      .badge .tick-path { stroke-dashoffset: 22; }
      .option-btn.selected .badge .tick-path { stroke-dashoffset: 0; }
      .tick { opacity: 0; }
      .send-btn.submitted .tick { opacity: 1; }
      .send-btn.submitted .tick path { stroke-dashoffset: 0; }
      .other-panel { transition: none; }
    }
  </style>
</head>
<body>

  <p class="heading">How can we help you today?</p>

  <div class="options" id="options">

    <button class="option-btn" type="button" data-value="I have a problem with my machine.">
      <span class="badge">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <g class="icon-path">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </g>
          <path class="tick-path" d="M5 12.5 10 17.5 19 6.5"/>
        </svg>
      </span>
      <span class="label">I have a problem with my machine</span>
      <span class="chev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></span>
    </button>

    <button class="option-btn" type="button" data-value="I want to check on a service order.">
      <span class="badge">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <g class="icon-path">
            <circle cx="11" cy="11" r="6"/>
            <path d="M15.5 15.5 20 20"/>
            <path d="M8.5 11h5M11 8.5v5"/>
          </g>
          <path class="tick-path" d="M5 12.5 10 17.5 19 6.5"/>
        </svg>
      </span>
      <span class="label">Check on a service request</span>
      <span class="chev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></span>
    </button>

    <button class="option-btn" type="button" data-value="I want to order an item for my machine.">
      <span class="badge">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <g class="icon-path">
            <rect x="3.5" y="8" width="17" height="9" rx="1.5"/>
            <path d="M7 8V5.5h10V8M7 17v2h10v-2"/>
            <path d="M16.5 12.5h1.5"/>
          </g>
          <path class="tick-path" d="M5 12.5 10 17.5 19 6.5"/>
        </svg>
      </span>
      <span class="label">Order parts or consumables for my machine</span>
      <span class="chev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></span>
    </button>

    <button class="option-btn" type="button" data-value="I want to check on an existing order.">
      <span class="badge">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <g class="icon-path">
            <path d="M3.5 7.5 12 4l8.5 3.5v9L12 20l-8.5-3.5z"/>
            <path d="M3.5 7.5 12 11l8.5-3.5M12 11v9"/>
          </g>
          <path class="tick-path" d="M5 12.5 10 17.5 19 6.5"/>
        </svg>
      </span>
      <span class="label">Check on a parts order</span>
      <span class="chev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></span>
    </button>

    <button class="option-btn" type="button" id="otherBtn">
      <span class="badge">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <g class="icon-path">
            <path d="M4 16.5 15 5.5l3.5 3.5L7.5 20H4z"/>
            <path d="M13 7.5 16.5 11"/>
          </g>
          <path class="tick-path" d="M5 12.5 10 17.5 19 6.5"/>
        </svg>
      </span>
      <span class="label">Something else</span>
      <span class="chev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></span>
    </button>

  </div>

  <div class="other-panel" id="otherPanel">
    <textarea
      id="otherText"
      maxlength="100"
      placeholder="Tell us what you need help with"
      aria-label="Describe what you need help with"
    ></textarea>

    <div class="meter" id="meter"><span id="meterFill"></span></div>
    <div class="counter" id="counter">0 / 100</div>

    <button type="button" class="send-btn" id="sendBtn">
      <span id="sendLabel">Send</span>
      <svg class="tick" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M4 10.5 8 14.5 16 5.5"/>
      </svg>
    </button>
  </div>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <script>
    (function () {
      const MAX_CHARS = 100;
      const ERROR_RESET_MS = 2000;

      const buttons = Array.from(document.querySelectorAll('.option-btn'));
      const otherBtn = document.getElementById('otherBtn');
      const otherPanel = document.getElementById('otherPanel');
      const otherText = document.getElementById('otherText');
      const counter = document.getElementById('counter');
      const meter = document.getElementById('meter');
      const meterFill = document.getElementById('meterFill');
      const sendBtn = document.getElementById('sendBtn');
      const sendLabel = document.getElementById('sendLabel');
      const status = document.getElementById('status');

      let errorTimer = null;
      let locked = false;

      function setStatus(message) {
        status.textContent = message || '';
        status.classList.toggle('show', Boolean(message));
        status.classList.toggle('error', Boolean(message));
      }

      function lockAll() {
        locked = true;
        buttons.forEach(function (b) { b.disabled = true; });
        otherText.disabled = true;
        sendBtn.disabled = true;
      }

      function send(value) {
        try {
          parent.window.postMessage('widget-message:' + value, '*');
          return true;
        } catch (err) {
          console.error(err);
          setStatus('Unable to connect to chat widget.');
          return false;
        }
      }

      buttons.forEach(function (btn) {
        if (btn === otherBtn) { return; }

        btn.addEventListener('click', function () {
          if (locked) { return; }

          if (send(this.getAttribute('data-value'))) {
            this.classList.add('selected');
            otherPanel.classList.remove('show');
            otherBtn.classList.remove('open');
            lockAll();
          }
        });
      });

      otherBtn.addEventListener('click', function () {
        if (locked) { return; }

        const isOpen = otherPanel.classList.toggle('show');
        otherBtn.classList.toggle('open', isOpen);
        setStatus('');

        if (isOpen) {
          otherText.focus();
        }
      });

      otherText.addEventListener('input', function () {
        const used = this.value.length;
        const pct = Math.round((used / MAX_CHARS) * 100);

        counter.textContent = used + ' / ' + MAX_CHARS;
        meterFill.style.width = pct + '%';

        const atLimit = used >= MAX_CHARS;
        counter.classList.toggle('limit', atLimit);
        meter.classList.toggle('limit', atLimit);

        this.classList.remove('invalid');
        sendBtn.classList.remove('error');
        sendLabel.textContent = 'Send';
        clearTimeout(errorTimer);
        setStatus('');
      });

      sendBtn.addEventListener('click', function () {
        if (locked) { return; }

        const value = otherText.value.trim();

        if (value.length === 0) {
          clearTimeout(errorTimer);
          otherText.classList.add('invalid');
          setStatus('Type what you need help with before sending.');

          sendBtn.classList.remove('error');
          void sendBtn.offsetWidth;
          sendBtn.classList.add('error');
          sendLabel.textContent = 'Type something first';

          errorTimer = setTimeout(function () {
            sendBtn.classList.remove('error');
            sendLabel.textContent = 'Send';
          }, ERROR_RESET_MS);

          otherText.focus();
          return;
        }

        if (send(value)) {
          otherBtn.classList.remove('open');
          otherBtn.classList.add('selected');
          lockAll();
          sendBtn.classList.remove('error');
          sendBtn.classList.add('submitted');
          sendLabel.textContent = 'Sent';
        }
      });
    })();
  </script>
</body>
</html>
