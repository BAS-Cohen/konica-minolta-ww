<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patient Information</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      padding: 12px 16px;
    }
    .heading {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 12px;
    }
    .form-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #4b5563;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      color: #111827;
      background: white;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }
    input::placeholder { color: #9ca3af; }
    .row {
      display: flex;
      gap: 8px;
    }
    .row .form-group { flex: 1; }
    .submit-btn {
      width: 100%;
      padding: 11px;
      background: #1a3a5c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.2s;
    }
    .submit-btn:hover { background: #254d73; }
    .submit-btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .status {
      margin-top: 8px;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      display: none;
    }
    .status.show { display: block; }
    .status.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .status.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
  </style>
</head>
<body>
  <p class="heading">Please provide your information:</p>
  <form id="patientForm">
    <div class="row">
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" placeholder="John" required>
      </div>
      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" placeholder="Smith" required>
      </div>
    </div>
    <div class="row">
      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="text" id="dob" placeholder="MM/DD/YYYY" required>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="(555) 123-4567" required>
      </div>
    </div>
    <button type="submit" class="submit-btn" id="submitBtn">Submit</button>
  </form>
  <div id="status" class="status"></div>

  <script>
    (function () {
      const form = document.getElementById('patientForm');
      const status = document.getElementById('status');
      const submitBtn = document.getElementById('submitBtn');

      // Auto-format date of birth
      const dobInput = document.getElementById('dob');
      dobInput.addEventListener('input', function (e) {
        let val = this.value.replace(/\D/g, '');
        if (val.length > 2 && val.length <= 4) {
          val = val.slice(0, 2) + '/' + val.slice(2);
        } else if (val.length > 4) {
          val = val.slice(0, 2) + '/' + val.slice(2, 4) + '/' + val.slice(4, 8);
        }
        this.value = val;
      });

      // Auto-format phone number
      const phoneInput = document.getElementById('phone');
      phoneInput.addEventListener('input', function (e) {
        let val = this.value.replace(/\D/g, '');
        if (val.length > 6) {
          val = '(' + val.slice(0, 3) + ') ' + val.slice(3, 6) + '-' + val.slice(6, 10);
        } else if (val.length > 3) {
          val = '(' + val.slice(0, 3) + ') ' + val.slice(3);
        } else if (val.length > 0) {
          val = '(' + val;
        }
        this.value = val;
      });

      function setStatus(message, type) {
        status.textContent = message || '';
        status.classList.remove('error', 'success', 'show');
        if (type) { status.classList.add(type, 'show'); }
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const dob = document.getElementById('dob').value.trim();
        const phone = document.getElementById('phone').value.trim();

        if (!firstName || !lastName || !dob || !phone) {
          setStatus('Please fill in all fields.', 'error');
          return;
        }

        const message = `First Name: ${firstName}, Last Name: ${lastName}, Date of Birth: ${dob}, Phone: ${phone}`;

        try {
          parent.window.postMessage('widget-message:' + message, '*');
          setStatus('Information submitted!', 'success');
          submitBtn.disabled = true;
          form.querySelectorAll('input').forEach(function (input) { input.disabled = true; });
        } catch (err) {
          console.error(err);
          setStatus('Unable to connect to chat widget.', 'error');
        }
      });
    })();
  </script>
</body>
</html>
