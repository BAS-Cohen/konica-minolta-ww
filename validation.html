<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Device Lookup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      padding: 12px 16px;
    }
    .heading {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 12px;
    }
    .form-group { margin-bottom: 10px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #4b5563;
      margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      background: white;
      color: #111827;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s, opacity 0.2s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    input[type="text"].invalid {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
    }
    input[type="text"]:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      background: #f9fafb;
    }
    input::placeholder { color: #9ca3af; }
    #serial { text-transform: uppercase; letter-spacing: 0.04em; }

    .hint {
      margin-top: 4px;
      font-size: 11px;
      color: #6b7280;
      transition: color 0.15s;
    }
    .hint.invalid { color: #dc2626; }

    .unknown {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 0 0 10px;
      font-size: 12px;
      color: #4b5563;
      cursor: pointer;
    }
    .unknown input {
      margin-top: 1px;
      accent-color: #1a3a5c;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 14px;
      background: #1a3a5c;
      color: #ffffff;
      border: 1px solid #1a3a5c;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
    }
    .submit-btn:hover:not(:disabled):not(.error) {
      background: #254d73;
      border-color: #254d73;
    }
    .submit-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.35);
    }
    .submit-btn.error {
      background: #fef2f2;
      border-color: #dc2626;
      color: #b91c1c;
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px); }
      40% { transform: translateX(4px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }
    .submit-btn.submitted {
      background: #1a3a5c;
      border-color: #1a3a5c;
      color: #ffffff;
      cursor: default;
      opacity: 1;
      animation: settle 0.45s ease;
    }
    @keyframes settle {
      0% { box-shadow: 0 0 0 0 rgba(26, 58, 92, 0.35); }
      100% { box-shadow: 0 0 0 10px rgba(26, 58, 92, 0); }
    }
    .submit-btn:disabled { opacity: 1; }

    .tick {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.15s ease, transform 0.2s ease;
    }
    .tick path {
      stroke: #ffffff;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 22;
      stroke-dashoffset: 22;
      transition: stroke-dashoffset 0.35s ease 0.05s;
    }
    .submit-btn.submitted .tick { opacity: 1; transform: scale(1); }
    .submit-btn.submitted .tick path { stroke-dashoffset: 0; }

    .status {
      margin-top: 8px;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      display: none;
    }
    .status.show { display: block; }
    .status.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .tick { opacity: 0; }
      .submit-btn.submitted .tick { opacity: 1; }
      .tick path { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <p class="heading">Look up your device:</p>

  <form id="lookupForm" novalidate>
    <div class="form-group">
      <label for="serial">Serial Number</label>
      <input type="text" id="serial" placeholder="SA1234567890" maxlength="18" autocomplete="off" spellcheck="false">
      <div class="hint" id="serialHint">Between 10 and 18 characters. Hardware serials start with SA.</div>
    </div>

    <div class="form-group">
      <label for="postcode">Post Code</label>
      <input type="text" id="postcode" placeholder="2113" maxlength="4" autocomplete="postal-code" inputmode="numeric">
      <div class="hint" id="postcodeHint">The postcode where the device is installed.</div>
    </div>

    <label class="unknown" for="unknown">
      <input type="checkbox" id="unknown">
      <span>I do not know my postcode or serial number</span>
    </label>

    <button type="submit" class="submit-btn" id="submitBtn">
      <span id="btnLabel">Submit device details</span>
      <svg class="tick" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5 8 14.5 16 5.5"/></svg>
    </button>
  </form>
  <div id="status" class="status"></div>

  <script>
    (function () {
      const DEFAULT_LABEL = 'Submit device details';
      const MIN_SERIAL = 10;
      const MAX_SERIAL = 18;

      const form = document.getElementById('lookupForm');
      const serialInput = document.getElementById('serial');
      const serialHint = document.getElementById('serialHint');
      const postcode = document.getElementById('postcode');
      const postcodeHint = document.getElementById('postcodeHint');
      const unknown = document.getElementById('unknown');
      const submitBtn = document.getElementById('submitBtn');
      const btnLabel = document.getElementById('btnLabel');
      const status = document.getElementById('status');

      let errorTimer = null;
      let locked = false;

      function setStatus(message) {
        status.textContent = message || '';
        status.classList.toggle('show', Boolean(message));
        status.classList.toggle('error', Boolean(message));
      }

      function clearErrors() {
        if (locked) { return; }
        clearTimeout(errorTimer);
        submitBtn.classList.remove('error');
        btnLabel.textContent = DEFAULT_LABEL;
        serialInput.classList.remove('invalid');
        serialHint.classList.remove('invalid');
        postcode.classList.remove('invalid');
        postcodeHint.classList.remove('invalid');
        setStatus('');
      }

      function fail(input, hint, message) {
        clearTimeout(errorTimer);
        input.classList.add('invalid');
        hint.classList.add('invalid');
        setStatus(message);

        submitBtn.classList.remove('error');
        void submitBtn.offsetWidth;
        submitBtn.classList.add('error');
        btnLabel.textContent = 'Check the highlighted field';

        errorTimer = setTimeout(function () {
          submitBtn.classList.remove('error');
          btnLabel.textContent = DEFAULT_LABEL;
        }, 2000);

        input.focus();
      }

      serialInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase().slice(0, MAX_SERIAL);
        clearErrors();
      });

      postcode.addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 4);
        clearErrors();
      });

      // Ticking the box clears and disables both fields.
      unknown.addEventListener('change', function () {
        const skip = this.checked;
        serialInput.disabled = skip;
        postcode.disabled = skip;
        if (skip) {
          serialInput.value = '';
          postcode.value = '';
        }
        clearErrors();
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (locked) { return; }

        const skip = unknown.checked;
        const serial = serialInput.value.trim();
        const code = postcode.value.trim();

        if (!skip) {
          if (!serial) {
            fail(serialInput, serialHint, 'Please enter your serial number, or tick the box below if you cannot find it.');
            return;
          }

          if (serial.length < MIN_SERIAL || serial.length > MAX_SERIAL) {
            fail(serialInput, serialHint, 'Serial numbers are between ' + MIN_SERIAL + ' and ' + MAX_SERIAL + ' characters.');
            return;
          }

          if (!code) {
            fail(postcode, postcodeHint, 'Please enter the postcode where the device is installed.');
            return;
          }

          if (code.length < 3) {
            fail(postcode, postcodeHint, 'Please enter a valid postcode.');
            return;
          }
        }

        try {
          parent.window.postMessage(
            'widget-message:Serial Number: ' + (skip ? 'Not known' : serial) +
            ', Post Code: ' + (skip ? 'Not known' : code),
            '*'
          );
          locked = true;
          serialInput.disabled = true;
          postcode.disabled = true;
          unknown.disabled = true;
          submitBtn.disabled = true;
          submitBtn.classList.remove('error');
          submitBtn.classList.add('submitted');
          btnLabel.textContent = 'Details sent';
        } catch (err) {
          console.error(err);
          setStatus('Unable to connect to chat widget.');
        }
      });
    })();
  </script>
</body>
</html>
