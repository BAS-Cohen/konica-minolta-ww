<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <title>Device Lookup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      padding: 12px 16px;
    }
    .heading {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 12px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #4b5563;
      margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      background: white;
      color: #1a1a2e;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.2s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #0067b1;
      box-shadow: 0 0 0 3px rgba(0, 103, 177, 0.1);
    }
    input[type="text"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: #f9fafb;
    }
    input::placeholder { color: #9ca3af; }
    #serial { text-transform: uppercase; letter-spacing: 0.04em; }
    .hint {
      margin-top: 4px;
      font-size: 11px;
      color: #6b7280;
    }
    .unknown {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: -4px 0 12px;
      font-size: 12px;
      color: #4b5563;
      cursor: pointer;
    }
    .unknown input {
      margin-top: 1px;
      accent-color: #0067b1;
      cursor: pointer;
    }
    .submit-btn {
      width: 100%;
      padding: 10px 14px;
      background: white;
      color: #1a1a2e;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }
    .submit-btn:hover {
      border-color: #0067b1;
      background: #f0f5fa;
    }
    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .submit-btn.submitted {
      border-color: #0067b1;
      background: #e8f0fe;
      font-weight: 600;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      display: none;
    }
    .status.show { display: block; }
    .status.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .status.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
  </style>
</head>
<body>
  <div class="heading">Look up your device</div>

  <form id="lookupForm" novalidate>
    <div class="form-group">
      <label for="serial">Device Serial Number:</label>
      <input type="text" id="serial" inputmode="text" autocomplete="off" spellcheck="false" placeholder="SA1234567890" maxlength="15">
      <div class="hint">Up to 15 characters. Hardware serials start with SA.</div>
    </div>

    <label class="unknown" for="noSerial">
      <input type="checkbox" id="noSerial">
      <span>I do not know my serial number</span>
    </label>

    <div class="form-group">
      <label for="postcode">Site Postcode:</label>
      <input type="text" id="postcode" inputmode="numeric" autocomplete="postal-code" placeholder="2113" maxlength="4">
      <div class="hint">The postcode where the device is installed.</div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">Submit</button>
  </form>
  <div id="status" class="status"></div>

  <script>
    (function () {
      // Accepted postcode ranges. Australia only.
      // Add [1000, 9999] style pairs here to accept New Zealand later.
      const POSTCODE_RANGES = [
        [200, 299],    // ACT (LVR)
        [800, 999],    // NT
        [1000, 2599],  // NSW
        [2600, 2618],  // ACT
        [2619, 2899],  // NSW
        [2900, 2920],  // ACT
        [2921, 2999],  // NSW
        [3000, 3999],  // VIC
        [4000, 4999],  // QLD
        [5000, 5999],  // SA
        [6000, 6797],  // WA
        [6800, 6999],  // WA
        [7000, 7999],  // TAS
        [8000, 8999],  // VIC (LVR)
        [9000, 9999]   // QLD (LVR)
      ];

      const MAX_SERIAL_LENGTH = 15;

      const form = document.getElementById('lookupForm');
      const serialInput = document.getElementById('serial');
      const postcodeInput = document.getElementById('postcode');
      const noSerial = document.getElementById('noSerial');
      const submitBtn = document.getElementById('submitBtn');
      const status = document.getElementById('status');

      // Serial: strip anything that is not alphanumeric, force uppercase, cap length.
      serialInput.addEventListener('input', function () {
        this.value = this.value
          .replace(/[^a-zA-Z0-9]/g, '')
          .toUpperCase()
          .slice(0, MAX_SERIAL_LENGTH);
      });

      // Postcode: digits only, four max.
      postcodeInput.addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 4);
      });

      noSerial.addEventListener('change', function () {
        serialInput.disabled = this.checked;
        if (this.checked) { serialInput.value = ''; }
        setStatus('', null);
      });

      function isValidAuPostcode(value) {
        if (!/^\d{4}$/.test(value)) { return false; }
        const n = parseInt(value, 10);
        return POSTCODE_RANGES.some(function (range) {
          return n >= range[0] && n <= range[1];
        });
      }

      function setStatus(message, type) {
        status.textContent = message || '';
        status.classList.remove('error', 'success', 'show');
        if (type) { status.classList.add(type, 'show'); }
      }

      function lock() {
        serialInput.disabled = true;
        postcodeInput.disabled = true;
        noSerial.disabled = true;
        submitBtn.disabled = true;
        submitBtn.classList.add('submitted');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        const serial = serialInput.value.trim();
        const postcode = postcodeInput.value.trim();
        const skipSerial = noSerial.checked;

        if (!skipSerial && serial.length === 0) {
          setStatus('Enter your serial number, or tick the box if you cannot find it.', 'error');
          serialInput.focus();
          return;
        }

        if (!skipSerial && serial.length > MAX_SERIAL_LENGTH) {
          setStatus('Serial numbers are no longer than ' + MAX_SERIAL_LENGTH + ' characters.', 'error');
          serialInput.focus();
          return;
        }

        if (postcode.length === 0) {
          setStatus('Enter the site postcode.', 'error');
          postcodeInput.focus();
          return;
        }

        if (!isValidAuPostcode(postcode)) {
          setStatus('That is not a valid Australian postcode. Enter the four digit postcode for the site.', 'error');
          postcodeInput.focus();
          return;
        }

        // Payload sent back to the chat. One readable line for extraction.
        const payload = skipSerial
          ? 'Serial number: not known, Postcode: ' + postcode
          : 'Serial number: ' + serial + ', Postcode: ' + postcode;

        try {
          parent.window.postMessage('widget-message:' + payload, '*');
          lock();
          setStatus('Got it!', 'success');
        } catch (err) {
          console.error(err);
          setStatus('Unable to connect to chat widget.', 'error');
        }
      });
    })();
  </script>
</body>
</html>
